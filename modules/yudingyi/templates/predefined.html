<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>预定义配置</title>
<style>
  body { margin: 0; padding: 0; user-select: none; background: #fff; }
  #pdfContainer img {
    display: block;      /* 避免 inline 间距 */
    width: 100%;         /* 图片宽度铺满容器 */
    margin: 0;           /* 去掉 margin */
    padding: 0;          /* 去掉 padding */
    border: none;        /* 去掉边框 */
  }
</style>
</head>
<body oncontextmenu="return false;">
<div id="pdfContainer">
  {% for img in img_urls %}
    <img src="{{ img }}" alt="页">
  {% endfor %}
</div>
</body>
</html>
